[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = ["commitizen>=4.17.0", "cz-path>=0.0.7", "mypy>=2.3.1", "ruff==0.16.4", "ty>=0.0.72"]
docs = [
  "autodoc-pydantic>=2.2.0",
  "doc8>=2.0.0",
  "enum-tools[sphinx]>=0.13.0",
  "esbonio>=2.1.0",
  "restructuredtext-lint>=2.0.2",
  "sphinx-click>=6.2.0",
  "sphinx-datatables>=1.0.0",
  "sphinx-immaterial>=0.13.9",
  "sphinx>=9.1.0; python_version >= \"3.13\"",
]
tests = [
  "coveralls>=4.1.0",
  "mock>=5.2.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "bascom>=0.2.0",
  "click>=8.4.2",
  "typing-extensions>=4.16.0",
  "huggingface-hub>=1.27.0",
  "librosa>=1.0.0",
  "mutagen>=1.48.1",
  "numpy>=2.5.2",
  "pillow>=12.3.0",
  "scipy>=1.18.0",
  "soundfile>=0.14.0",
  "torch>=2.11.0",
]
description = "Generate StepMania dance-single charts from audio using machine learning."
keywords = [
  "audio",
  "command line",
  "dance dance revolution",
  "machine learning",
  "simfile",
  "stepmania",
]
license = "MIT"
name = "smlab"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.0.0"

[[project.authors]]
email = "audvare@gmail.com"
name = "Andrew Udvare"

[project.optional-dependencies]
stems = ["demucs>=4.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.scripts]
smlab = "smlab.main:main"

[project.urls]
Issues = "https://github.com/Tatsh/smlab/issues"
documentation = "https://smlab.readthedocs.org"
homepage = "https://tatsh.github.io/smlab/"
repository = "https://github.com/Tatsh/smlab"

[tool.commitizen]
name = "cz_path"
remove_path_prefixes = ["include", "smlab", "src"]
tag_format = "v$version"
version_files = [
  ".wiswa.jsonnet",
  "CITATION.cff",
  "README.md",
  "docs/badges.rst",
  "docs/index.rst",
  "man/smlab.1",
  "package.json",
  "sh.tat.smlab.yml",
  "smlab/__init__.py",
  "snapcraft.yaml",
]
version_provider = "pep621"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
omit = [
  "conftest.py",
  "smlab/__main__.py",
  "tests.py",
  "tests/*/test_*.py",
  "tests/test_*.py",
  "smlab/typing.py",
]
show_missing = true

[tool.coverage.run]
branch = true
omit = [
  "conftest.py",
  "smlab/__main__.py",
  "tests.py",
  "tests/*/test_*.py",
  "tests/test_*.py",
  "smlab/typing.py",
]

[tool.doc8]
max-line-length = 100

[tool.hatch.build.targets.sdist]
include = ["smlab", "man", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["smlab"]

[tool.mypy]
cache_dir = "~/.cache/mypy"
explicit_package_bases = true
platform = "linux"
python_version = "3.12"
show_column_numbers = true
strict = true
strict_optional = true
warn_unreachable = true

[tool.pyright]
deprecateTypingAliases = true
enableExperimentalFeatures = true
exclude = [".sbclaude-venv", ".venv", "**/node_modules", "**/__pycache__", "**/.*"]
include = ["./smlab", "./tests"]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportCallInDefaultInitializer = "warning"
reportImplicitOverride = "warning"
reportImportCycles = "error"
reportMissingModuleSource = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryTypeIgnoreComment = "none"
typeCheckingMode = "off"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
mock_use_standalone_module = true
norecursedirs = ["node_modules"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
cache-dir = "~/.cache/ruff"
force-exclude = true
line-length = 100
namespace-packages = ["docs", "tests"]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
quote-style = "single"

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D203",
  "D204",
  "D212",
  "N818",
  "Q000",
  "Q003",
  "RUF105",
  "RUF106",
  "RUF201",
  "S404",
  "S603",
  "TD002",
]
preview = true

[tool.ruff.lint.flake8-builtins]
allowed-modules = ["types", "typing"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
from-first = true
known-first-party = ["smlab"]
required-imports = ["from __future__ import annotations"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["test_*"]

[tool.ruff.lint.per-file-ignores]
"smlab/main.py" = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 20
max-locals = 20
max-positional-args = 15
max-public-methods = 30
max-returns = 10
max-statements = 100

[tool.uv]
cache-dir = ".uv-cache"
default-groups = "all"
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32'",
]
exclude-newer = "1 week"
